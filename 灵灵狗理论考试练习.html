<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵灵狗·宠物美容师四级理论考试</title>
  <style>
    :root {
      --primary: #6C5CE7;
      --primary-dark: #5B4CCC;
      --success: #00B894;
      --success-light: #E8F8F5;
      --error: #E17055;
      --error-light: #FDEDEA;
      --warn: #FDCB6E;
      --warn-light: #FEF9E7;
      --bg: #F5F6FA;
      --card: #FFFFFF;
      --text: #2D3436;
      --text-muted: #636E72;
      --border: #DFE6E9;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(108,92,231,0.25);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-brand .logo {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-brand h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .header-brand span {
      font-size: 12px;
      opacity: 0.8;
    }

    .timer-display {
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ── Main ── */
    main {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 16px 60px;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .progress-bar-track {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #a29bfe);
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .progress-stats {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 13px;
    }

    .progress-stats .correct { color: var(--success); font-weight: 600; }
    .progress-stats .wrong { color: var(--error); font-weight: 600; }

    /* ── Question Card ── */
    .question-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .q-type-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .q-type-badge.single { background: #E8F0FE; color: #4A6CF7; }
    .q-type-badge.multi { background: #FFF3E0; color: #E67E22; }
    .q-type-badge.tf { background: #E8F8F5; color: #00B894; }

    .q-number {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .q-text {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 22px;
      font-weight: 500;
    }

    /* ── Options ── */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
      transition: all 0.18s ease;
      color: var(--text);
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #F0EDFF;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: #EDE9FF;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-light);
      color: #007A5E;
    }

    .option-btn.wrong {
      border-color: var(--error);
      background: var(--error-light);
      color: #C0392B;
    }

    .option-btn.show-correct {
      border-color: var(--success);
      background: var(--success-light);
    }

    .option-btn:disabled { cursor: default; }

    .option-key {
      min-width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .option-btn.selected .option-key {
      background: var(--primary);
      color: white;
    }

    .option-btn.correct .option-key {
      background: var(--success);
      color: white;
    }

    .option-btn.wrong .option-key {
      background: var(--error);
      color: white;
    }

    /* ── TF Buttons ── */
    .tf-buttons {
      display: flex;
      gap: 16px;
    }

    .tf-btn {
      flex: 1;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: white;
      cursor: pointer;
      font-size: 22px;
      font-weight: 700;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .tf-btn span { font-size: 13px; color: var(--text-muted); font-weight: 400; }

    .tf-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #F0EDFF;
    }

    .tf-btn.true-btn:hover:not(:disabled) {
      border-color: var(--success);
      background: var(--success-light);
    }

    .tf-btn.false-btn:hover:not(:disabled) {
      border-color: var(--error);
      background: var(--error-light);
    }

    .tf-btn:disabled { cursor: default; }
    .tf-btn.correct-true { border-color: var(--success); background: var(--success-light); }
    .tf-btn.wrong-false { border-color: var(--error); background: var(--error-light); }
    .tf-btn.show-true { border-color: var(--success); background: var(--success-light); }

    /* ── Multi-choice note ── */
    .multi-note {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding: 8px 12px;
      background: #FFF9E6;
      border-radius: 8px;
      border-left: 3px solid var(--warn);
    }

    /* ── Submit Button ── */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.18s ease;
    }

    .submit-btn:hover { background: var(--primary-dark); }
    .submit-btn:disabled { background: #B2BEC3; cursor: default; }

    /* ── Feedback ── */
    .feedback {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.2s ease;
    }

    .feedback.correct {
      background: var(--success-light);
      color: #007A5E;
      border: 1.5px solid var(--success);
    }

    .feedback.wrong {
      background: var(--error-light);
      color: #C0392B;
      border: 1.5px solid var(--error);
    }

    .feedback-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 4px;
    }

    /* ── Next group button ── */
    .next-group-btn {
      width: 100%;
      padding: 16px;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.18s ease;
    }

    .next-group-btn:hover { background: #00A381; }

    /* ── Welcome screen ── */
    .welcome-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .welcome-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .welcome-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .welcome-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .welcome-stat {
      background: white;
      border-radius: 12px;
      padding: 16px 8px;
      box-shadow: var(--shadow);
    }

    .welcome-stat .num {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
    }

    .welcome-stat .label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .start-btn {
      width: 100%;
      max-width: 360px;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .start-btn:hover { background: var(--primary-dark); }

    /* ── Completion screen ── */
    .completion-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .completion-icon { font-size: 64px; margin-bottom: 16px; }

    .completion-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--success);
      margin-bottom: 8px;
    }

    .completion-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .restart-btn {
      padding: 14px 32px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── Group complete banner ── */
    .group-banner {
      background: linear-gradient(135deg, var(--success), #00CEC9);
      color: white;
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    .group-banner .icon { font-size: 40px; margin-bottom: 10px; }
    .group-banner .title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .group-banner .sub { font-size: 13px; opacity: 0.9; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .q-text { font-size: 15px; }
      .welcome-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .welcome-stat .num { font-size: 20px; }
      .question-card { padding: 20px 16px; }
      header { padding: 12px 16px; }
      .header-brand h1 { font-size: 15px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="logo">🐾</div>
    <div>
      <h1>灵灵狗·理论考试练习</h1>
      <span>宠物美容师四级（中级工）</span>
    </div>
  </div>
  <div class="timer-display" id="timer">⏱ 00:00</div>
</header>

<main id="app"></main>

<script>
const GROUP_SIZE = 20;

// ── Data (loaded from questions.json) ──
let allQuestions = [];
let timerSeconds = 0;
let timerInterval = null;

// ── State ──
let state = {
  phase: 'welcome',    // welcome | quiz | group_complete | all_done
  currentGroupIndex: 0,
  currentGroupQuestions: [],
  currentQuestionIndex: 0,
  correctInGroup: 0,
  attemptsInQuestion: 0,
  // per-group: which questions have been answered correctly
  groupSolved: [],     // Set of question indices solved in this group
  // shuffled options for current display
  shuffledOptions: [],
  // selected options
  selectedKeys: [],
  // submitted
  submitted: false,
  // last wrong
  lastWrong: false,
};

// ── Progress Save / Load (localStorage) ──
const PROGRESS_KEY = 'llg_quiz_progress';

function saveProgress() {
  if (state.phase !== 'quiz' && state.phase !== 'group_complete') return;
  const data = {
    phase: state.phase,
    currentGroupIndex: state.currentGroupIndex,
    currentQuestionIndex: state.currentQuestionIndex,
    groupSolved: [...state.groupSolved],
    shuffledOptions: state.shuffledOptions || [],
    selectedKeys: state.selectedKeys || [],
    submitted: state.submitted,
    attemptsInQuestion: state.attemptsInQuestion,
    correctInGroup: state.correctInGroup,
    timerSeconds: timerSeconds,
  };
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); } catch(e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || typeof d.currentGroupIndex !== 'number') return null;
    return d;
  } catch(e) { return null; }
}

function clearProgress() {
  try { localStorage.removeItem(PROGRESS_KEY); } catch(e) {}
}

window.addEventListener('beforeunload', () => { saveProgress(); });

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

// ── Timer ──
function startTimer(initialSeconds) {
  stopTimer();
  timerSeconds = (typeof initialSeconds === 'number' && initialSeconds >= 0) ? initialSeconds : 0;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerDisplay() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const s = String(timerSeconds % 60).padStart(2, '0');
  const el = $('#timer');
  if (el) el.textContent = `⏱ ${m}:${s}`;
}

// ── Shuffle ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Render ──
function render() {
  const app = $('#app');
  if (state.phase === 'welcome') {
    renderWelcome(app);
  } else if (state.phase === 'quiz') {
    renderQuiz(app);
  } else if (state.phase === 'group_complete') {
    renderGroupComplete(app);
  } else if (state.phase === 'all_done') {
    renderAllDone(app);
  }
}

function renderWelcome(container) {
  const totalGroups = Math.ceil(allQuestions.length / GROUP_SIZE);
  const single = allQuestions.filter(q => q.type === 'single').length;
  const multi  = allQuestions.filter(q => q.type === 'multi').length;
  const tf    = allQuestions.filter(q => q.type === 'tf').length;

  const saved = loadProgress();
  let resumeHTML = '';
  if (saved) {
    const groupNum = (saved.currentGroupIndex || 0) + 1;
    const qNum = (saved.currentQuestionIndex || 0) + 1;
    const solved = saved.groupSolved ? saved.groupSolved.length : 0;
    const tMin = String(Math.floor((saved.timerSeconds || 0) / 60)).padStart(2, '0');
    const tSec = String((saved.timerSeconds || 0) % 60).padStart(2, '0');
    resumeHTML = `
      <div style="background:#FFF9E6;border:1.5px solid #FDCB6E;border-radius:12px;padding:16px 20px;margin-bottom:20px;text-align:left;animation:fadeIn 0.3s ease;">
        <div style="font-size:14px;font-weight:700;color:#E67E22;margin-bottom:8px;">📂 发现未完成的练习</div>
        <div style="font-size:13px;color:var(--text);line-height:1.8;">
          第 ${groupNum} 组 · 第 ${qNum} 题<br>
          本组已答对 ${solved} / ${GROUP_SIZE} 题 · 已用 ${tMin}:${tSec}
        </div>
        <div style="display:flex;gap:12px;margin-top:14px;">
          <button class="start-btn" style="background:var(--success);padding:12px 24px;font-size:15px;" onclick="resumeQuiz()">继续练习</button>
          <button class="start-btn" style="background:var(--text-muted);padding:12px 24px;font-size:15px;" onclick="clearProgress();renderWelcome(document.getElementById('app'));">重新开始</button>
        </div>
      </div>
    `;
  }

  container.innerHTML = `
    <div class="welcome-screen">
      <div class="welcome-icon">🐾</div>
      <div class="welcome-title">欢迎来到灵灵狗理论练习</div>
      <div class="welcome-sub">宠物美容师四级（中级工）· 选择判断题练习</div>
      ${resumeHTML}
      <div class="welcome-stats">
        <div class="welcome-stat">
          <div class="num">${single}</div>
          <div class="label">单选题</div>
        </div>
        <div class="welcome-stat">
          <div class="num">${multi}</div>
          <div class="label">多选题</div>
        </div>
        <div class="welcome-stat">
          <div class="num">${tf}</div>
          <div class="label">判断题</div>
        </div>
      </div>
      <div class="welcome-stat" style="margin-bottom:28px; grid-column:1/-1; background:white; border-radius:12px; padding:14px; box-shadow:var(--shadow);">
        <div style="font-size:13px; color:var(--text-muted); line-height:1.7;">
          📌 每<span style="color:var(--primary); font-weight:700;">20题</span>为一组，本组全部答对方可进入下一组<br>
          📌 答错后显示正确答案并可重新作答（选项随机打乱）<br>
          📌 判断题请点击 <span style="color:var(--success);font-weight:700;">✓ 正确</span> 或 <span style="color:var(--error);font-weight:700;">✗ 错误</span>
        </div>
      </div>
      <button class="start-btn" onclick="startQuiz()">开始练习</button>
    </div>
  `;
}

function startQuiz() {
  clearProgress();
  state.phase = 'quiz';
  state.currentGroupIndex = 0;
  state.correctInGroup = 0;
  state.groupSolved = new Set();
  loadGroup(0);
  startTimer();
  render();
}

function resumeQuiz() {
  const saved = loadProgress();
  if (!saved) { startQuiz(); return; }
  state.phase = saved.phase || 'quiz';
  state.currentGroupIndex = saved.currentGroupIndex || 0;
  state.currentQuestionIndex = saved.currentQuestionIndex || 0;
  state.groupSolved = new Set(saved.groupSolved || []);
  state.shuffledOptions = saved.shuffledOptions || [];
  state.selectedKeys = saved.selectedKeys || [];
  state.submitted = saved.submitted || false;
  state.attemptsInQuestion = saved.attemptsInQuestion || 0;
  state.correctInGroup = saved.correctInGroup || 0;
  const start = state.currentGroupIndex * GROUP_SIZE;
  const end = start + GROUP_SIZE;
  state.currentGroupQuestions = allQuestions.slice(start, end);
  state.phase = 'quiz';
  startTimer(saved.timerSeconds || 0);
  render();
}

function loadGroup(groupIndex) {
  const start = groupIndex * GROUP_SIZE;
  const end = start + GROUP_SIZE;
  state.currentGroupQuestions = allQuestions.slice(start, end);
  state.currentQuestionIndex = 0;
  state.correctInGroup = 0;
  state.groupSolved = new Set();
  state.attemptsInQuestion = 0;
  state.submitted = false;
  state.selectedKeys = [];
  state.lastWrong = false;
}

function currentQuestion() {
  return state.currentGroupQuestions[state.currentQuestionIndex];
}

function renderQuiz(container) {
  const q = currentQuestion();
  if (!q) { state.phase = 'group_complete'; render(); return; }

  // Ensure options are shuffled for this question
  if (!state.shuffledOptions || state.shuffledOptions.length === 0) {
    state.shuffledOptions = shuffle(q.options);
  }

  // Build progress
  const total = state.currentGroupQuestions.length;
  const done = state.groupSolved.size;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  // Progress section
  let progressHTML = `
    <div class="progress-wrap">
      <div class="progress-label">
        <span>第 ${state.currentGroupIndex + 1} 组 · 第 ${state.currentQuestionIndex + 1} / ${total} 题</span>
        <span>${done} / ${total} 已完成</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width:${pct}%"></div>
      </div>
    </div>
  `;

  // Group completion banner if all done
  if (done === total) {
    container.innerHTML = progressHTML + `
      <div class="group-banner">
        <div class="icon">🎉</div>
        <div class="title">第 ${state.currentGroupIndex + 1} 组全部完成！</div>
        <div class="sub">即将进入下一组...</div>
      </div>
    `;
    setTimeout(() => {
      state.currentGroupIndex++;
      if (state.currentGroupIndex >= Math.ceil(allQuestions.length / GROUP_SIZE)) {
        state.phase = 'all_done';
      } else {
        loadGroup(state.currentGroupIndex);
        state.phase = 'quiz';
      }
      render();
    }, 1500);
    return;
  }

  // Options
  let optionsHTML = '';
  if (q.type === 'tf') {
    optionsHTML = `
      <div class="tf-buttons">
        <button class="tf-btn true-btn" id="tf-true" onclick="submitTF('true')">
          ✓
          <span>正确</span>
        </button>
        <button class="tf-btn false-btn" id="tf-false" onclick="submitTF('false')">
          ✗
          <span>错误</span>
        </button>
      </div>
    `;
  } else {
    if (q.type === 'multi') {
      optionsHTML += `<div class="multi-note">⚠️ 多选题：需选择所有正确答案，选错不得分</div>`;
    }
    optionsHTML += `<div class="options-list" id="options-list"></div>`;

    if (!state.submitted && state.selectedKeys.length > 0) {
      if (q.type === 'single') {
        optionsHTML += `<button class="submit-btn" onclick="submitSingleChoice()">提交答案</button>`;
      } else {
        optionsHTML += `<button class="submit-btn" onclick="submitMultiChoice()">提交答案</button>`;
      }
    }
  }

  // Type badge
  const typeMap = { single: '单选题', multi: '多选题', tf: '判断题' };
  const typeClass = { single: 'single', multi: 'multi', tf: 'tf' };

  container.innerHTML = progressHTML + `
    <div class="question-card">
      <span class="q-type-badge ${typeClass[q.type]}">${typeMap[q.type]}</span>
      <div class="q-number">第 ${q.number} 题</div>
      <div class="q-text">${q.text}</div>
      ${optionsHTML}
      <div id="feedback-area"></div>
    </div>
  `;

  // Render options
  if (q.type !== 'tf') {
    const list = $('#options-list');
    if (list) {
      list.innerHTML = state.shuffledOptions.map(opt => `
        <button class="option-btn${state.selectedKeys.includes(opt.key) ? ' selected' : ''}"
                onclick="toggleOption('${opt.key}')" ${state.submitted ? 'disabled' : ''}>
          <span class="option-key">${opt.key}</span>
          <span>${opt.text}</span>
        </button>
      `).join('');
    }
  }
}

function submitTF(answer) {
  const q = currentQuestion();
  const correct = q.answer === answer;

  $('#tf-true').disabled = true;
  $('#tf-false').disabled = true;

  if (correct) {
    if (answer === 'true') $('#tf-true').classList.add('correct-true');
    else $('#tf-false').classList.add('correct-true');

    showFeedback(true);
    setTimeout(() => advanceQuestion(), 1200);
  } else {
    if (answer === 'true') $('#tf-true').classList.add('wrong-false');
    else $('#tf-false').classList.add('wrong-false');
    // Show correct
    if (q.answer === 'true') $('#tf-true').classList.add('show-true');
    else $('#tf-false').classList.add('show-true');

    showFeedback(false, q.answer === 'true' ? '正确' : '错误');
    setTimeout(() => {
      // Reshuffle for retry
      state.selectedKeys = [];
      state.attemptsInQuestion++;
      $('#tf-true').disabled = false;
      $('#tf-false').disabled = false;
      $('#tf-true').className = 'tf-btn true-btn';
      $('#tf-false').className = 'tf-btn false-btn';
      clearFeedback();
      saveProgress();
    }, 1500);
  }
}

function toggleOption(key) {
  if (state.submitted) return;
  const q = currentQuestion();
  if (q.type === 'single') {
    state.selectedKeys = [key];
  } else {
    if (state.selectedKeys.includes(key)) {
      state.selectedKeys = state.selectedKeys.filter(k => k !== key);
    } else {
      state.selectedKeys = [...state.selectedKeys, key];
    }
  }
  renderQuiz($('#app'));
}

function submitSingleChoice() {
  const q = currentQuestion();
  const selected = state.selectedKeys[0];
  if (!selected) return;

  state.submitted = true;

  const correctAnswer = q.answer;
  const isCorrect = selected === correctAnswer;

  // Highlight options
  $$('.option-btn').forEach(btn => {
    btn.disabled = true;
    const k = btn.querySelector('.option-key').textContent;
    if (k === correctAnswer) btn.classList.add('correct');
    else if (k === selected && !isCorrect) btn.classList.add('wrong');
  });

  if (isCorrect) {
    showFeedback(true);
    state.groupSolved.add(state.currentQuestionIndex);
    setTimeout(() => advanceQuestion(), 1200);
  } else {
    const correctText = q.options.find(o => o.key === correctAnswer).text;
    showFeedback(false, `正确答案：${correctAnswer}. ${correctText}`);
    state.attemptsInQuestion++;
    setTimeout(() => {
      // Reshuffle options for retry
      state.shuffledOptions = shuffle(q.options);
      state.selectedKeys = [];
      state.submitted = false;
      renderQuiz($('#app'));
      saveProgress();
    }, 1800);
  }
}

function submitMultiChoice() {
  const q = currentQuestion();
  if (state.selectedKeys.length === 0) return;

  state.submitted = true;

  const correctSet = new Set(q.answer);
  const selectedSet = new Set(state.selectedKeys);

  const isCorrect =
    selectedSet.size === correctSet.size &&
    [...selectedSet].every(k => correctSet.has(k));

  // Highlight options
  $$('.option-btn').forEach(btn => {
    btn.disabled = true;
    const k = btn.querySelector('.option-key').textContent;
    if (correctSet.has(k)) btn.classList.add('correct');
    else if (selectedSet.has(k)) btn.classList.add('wrong');
  });

  if (isCorrect) {
    showFeedback(true);
    state.groupSolved.add(state.currentQuestionIndex);
    setTimeout(() => advanceQuestion(), 1200);
  } else {
    const correctText = q.answer.map(k => {
      const opt = q.options.find(o => o.key === k);
      return `${k}. ${opt ? opt.text : k}`;
    }).join('；');
    showFeedback(false, `正确答案：${correctText}`);
    state.attemptsInQuestion++;
    setTimeout(() => {
      state.shuffledOptions = shuffle(q.options);
      state.selectedKeys = [];
      state.submitted = false;
      renderQuiz($('#app'));
      saveProgress();
    }, 2000);
  }
}

function showFeedback(isCorrect, extra) {
  const area = $('#feedback-area');
  if (!area) return;
  if (isCorrect) {
    area.innerHTML = `
      <div class="feedback correct">
        <div class="feedback-title">✓ 回答正确！</div>
      </div>
    `;
  } else {
    area.innerHTML = `
      <div class="feedback wrong">
        <div class="feedback-title">✗ 回答错误！</div>
        ${extra ? `<div style="margin-top:6px; font-size:13px;">${extra}</div>` : ''}
        <div style="margin-top:6px; font-size:13px; opacity:0.8;">请重新作答本题（选项已打乱）</div>
      </div>
    `;
  }
}

function clearFeedback() {
  const area = $('#feedback-area');
  if (area) area.innerHTML = '';
}

function advanceQuestion() {
  clearFeedback();
  state.currentQuestionIndex++;
  state.attemptsInQuestion = 0;
  state.submitted = false;
  state.selectedKeys = [];

  // If end of group
  if (state.currentQuestionIndex >= state.currentGroupQuestions.length) {
    // Check if all solved
    if (state.groupSolved.size === state.currentGroupQuestions.length) {
      state.phase = 'group_complete';
    } else {
      // Find first unsolved
      for (let i = 0; i < state.currentGroupQuestions.length; i++) {
        if (!state.groupSolved.has(i)) {
          state.currentQuestionIndex = i;
          break;
        }
      }
    }
  }

  const q = currentQuestion();
  if (q) {
    state.shuffledOptions = shuffle(q.options);
  }

  render();
  saveProgress();
}

function renderGroupComplete(container) {
  const isLastGroup = state.currentGroupIndex >= Math.ceil(allQuestions.length / GROUP_SIZE) - 1;
  container.innerHTML = `
    <div class="group-banner" style="background:linear-gradient(135deg,#00B894,#00CEC9);">
      <div class="icon">🎉</div>
      <div class="title">第 ${state.currentGroupIndex + 1} 组全部完成！</div>
      <div class="sub">所有20题均已答对，继续加油！</div>
    </div>
    ${isLastGroup ? `
      <div class="question-card" style="text-align:center;">
        <div style="font-size:48px;margin-bottom:16px;">🏆</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:8px;">恭喜你完成全部练习！</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:24px;">
          共 ${allQuestions.length} 题 · ${Math.ceil(allQuestions.length / GROUP_SIZE)} 组
        </div>
        <button class="start-btn" onclick="restart()">重新开始</button>
      </div>
    ` : `
      <button class="next-group-btn" onclick="goNextGroup()">
        进入第 ${state.currentGroupIndex + 2} 组 →
      </button>
    `}
  `;
}

function goNextGroup() {
  state.currentGroupIndex++;
  loadGroup(state.currentGroupIndex);
  state.phase = 'quiz';
  saveProgress();
  render();
}

function renderAllDone(container) {
  stopTimer();
  const totalGroups = Math.ceil(allQuestions.length / GROUP_SIZE);
  container.innerHTML = `
    <div class="completion-screen">
      <div class="completion-icon">🏆</div>
      <div class="completion-title">恭喜完成全部练习！</div>
      <div class="completion-sub">
        共 ${allQuestions.length} 题 · ${totalGroups} 组<br>
        用时 ${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}
      </div>
      <button class="restart-btn" onclick="restart()">重新开始练习</button>
    </div>
  `;
}

function restart() {
  stopTimer();
  clearProgress();
  state.phase = 'welcome';
  render();
}
